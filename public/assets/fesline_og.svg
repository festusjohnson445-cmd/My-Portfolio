<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Vibrant Blue Gradient for Top Swoosh -->
    <linearGradient id="fesline-blue-grad-og" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0068FF" />
      <stop offset="100%" stop-color="#004BE0" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#080E21" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Clean White Background matching original graphic -->
  <rect width="1200" height="630" fill="#FFFFFF" />

  <!-- Subtle grid/accent background lines for professional engineering finish -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>

  <!-- Centered Logo Group (Scale 1.15, Offset to center x=205, y=210) -->
  <g transform="translate(205, 215) scale(1.15)" filter="url(#subtle-shadow)">
    <!-- ICON: F SWOOSH & BODY -->
    <!-- Top Blue Wing Swoosh -->
    <path d="M 32 64 C 58 26, 112 20, 222 20 C 185 46, 148 52, 122 52 L 58 52 C 45 52, 36 56, 32 64 Z" fill="url(#fesline-blue-grad-og)" />
    
    <!-- Deep Navy F Body & Crossbar -->
