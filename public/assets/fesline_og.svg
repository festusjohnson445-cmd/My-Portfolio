    <!-- s -->
    <path d="M 328 100 C 333 105, 342 108, 352 108 C 362 108, 369 103, 369 96 C 369 88, 360 85, 347 81 C 331 76, 324 67, 324 55 C 324 40, 338 32, 356 32 C 370 32, 382 38, 388 48 L 374 57 C 370 51, 363 47, 355 47 C 346 47, 340 51, 340 56 C 340 62, 348 65, 360 69 C 376 74, 385 82, 385 96 C 385 111, 370 120, 351 120 C 335 120, 322 112, 314 99 Z" fill="#080E21" />

    <!-- l -->
    <path d="M 402 24 C 402 20, 406 16, 412 16 L 422 16 C 428 16, 432 20, 432 24 L 432 112 C 432 116, 428 120, 422 120 L 412 120 C 406 120, 402 116, 402 112 Z" fill="#080E21" />

    <!-- i with leaf dot -->
    <!-- Stem -->
    <path d="M 452 50 C 452 46, 456 42, 462 42 L 472 42 C 478 42, 482 46, 482 50 L 482 112 C 482 116, 478 120, 472 120 L 462 120 C 456 120, 452 116, 452 112 Z" fill="#080E21" />
    <!-- Leaf / Teardrop Dot -->
    <path d="M 460 32 C 456 22, 462 14, 474 14 C 482 14, 486 22, 482 30 C 478 35, 466 36, 460 32 Z" fill="url(#fesline-blue-grad-og)" />

    <!-- n -->
    <path d="M 502 48 C 502 44, 506 40, 512 40 L 522 40 C 527 40, 531 44, 531 48 L 531 57 C 538 46, 549 40, 562 40 C 582 40, 592 53, 592 74 L 592 112 C 592 116, 588 120, 582 120 L 572 120 C 566 120, 562 116, 562 112 L 562 76 C 562 65, 556 57, 546 57 C 536 57, 531 65, 531 77 L 531 112 C 531 116, 527 120, 522 120 L 512 120 C 506 120, 502 116, 502 112 Z" fill="#080E21" />

    <!-- e -->
